[workspace]
members = [
  "crates/protocol",
  "crates/session-engine",
  "crates/prompt-compiler",
  "crates/policy-engine",
  "crates/execution-broker",
  "crates/agent-runtime",
  "crates/plugin-host",
  "crates/settings",
  "apps/daemon",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.85.1"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tempfile = "3.12"
uuid = { version = "1.10", features = ["v4", "serde"] }
ureq = { version = "2.12", features = ["json"] }
# Keep the Rust 1.85 builder on the pre-1.86 IDNA line pulled by url/ureq.
idna = "=1.0.3"
idna_adapter = "=1.1.0"
